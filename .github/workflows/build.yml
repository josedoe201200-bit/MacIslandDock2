name: Build MacIslandDock

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Upload generated source for diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MacIslandDock-generated-source-debug
          path: build/gen/island_port.cpp
          if-no-files-found: warn

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MacIslandDock-Windows-x64
          path: build/Release/MacIslandDock.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: ${{ github.sha }}
          name: MacIslandDock v1.0.0
          generate_release_notes: true
          files: build/Release/MacIslandDock.exe
