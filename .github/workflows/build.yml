name: Build MacIslandDock

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # ClangCL es el compilador mas parecido al que usa Windhawk (clang).
        # v143 es MSVC; si uno falla, el otro puede servir.
        toolset: [ClangCL, v143]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T ${{ matrix.toolset }}

      - name: Compilar (el archivo de la isla es enorme: puede tardar varios minutos)
        run: cmake --build build --config Release

      - name: Subir el .exe
        uses: actions/upload-artifact@v4
        with:
          name: MacIslandDock-${{ matrix.toolset }}
          path: build/Release/MacIslandDock.exe
          if-no-files-found: error
